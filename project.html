  </header><main id="main" class="wrap"><section class="hero"><a href="projects.html">← All projects</a><p class="eyebrow">Project case study</p><h1 id="title">Loading project…</h1><p id="summary" class="lead"></p><div id="tags"></div><div id="links" class="actions"></div></section><section class="section"><img id="cover" class="feature-image" hidden alt=""><div class="prose"><h2>Project details</h2><p id="details"></p></div><h2>Gallery & demonstrations</h2><div id="media" class="gallery"></div></section><dialog id="viewer"><button class="close" aria-label="Close image" id="close">Close</button><div id="viewer-body"></div></dialog></main><footer class="footer"><div class="wrap">© 2026 Felix Daka · <a href="mailto:felixddaka@gmail.com">Email</a> · <a href="https://github.com/Feligo1">GitHub</a> · <a href="https://www.linkedin.com/in/felix-daka-5b6058212">LinkedIn</a></div></footer><script type="module">import {supabase} from './supabase-client.js';import {el,showError} from './portfolio-v2.js';const slug=new URLSearchParams(location.search).get('slug'),root=document.querySelector('#media');if(!slug){document.querySelector('#title').textContent='Project not specified'}else{const {data:p,error}=await supabase.from('portfolio_projects').select('*').eq('slug',slug).eq('is_published',true).maybeSingle();if(error||!p){document.querySelector('#title').textContent='Project unavailable'}else{document.title=p.title+' | Felix Daka';document.querySelector('#title').textContent=p.title;document.querySelector('#summary').textContent=p.summary||'';document.querySelector('#details').textContent=p.description||'Further project details will be added.';if(p.cover_url){const img=document.querySelector('#cover');img.src=p.cover_url;img.alt=p.cover_alt||p.title;img.hidden=false}if(p.github_url){const a=el('a','Source code',{href:p.github_url,class:'button secondary',rel:'noopener noreferrer',target:'_blank'});document.querySelector('#links').append(a)}if(p.demo_url){const a=el('a','Live demonstration',{href:p.demo_url,class:'button',rel:'noopener noreferrer',target:'_blank'});document.querySelector('#links').append(a)}(p.technologies||[]).forEach(t=>document.querySelector('#tags').append(el('span',t,{class:'pill'})));const {data:media,error:mediaError}=await supabase.from('portfolio_project_media').select('*').eq('project_id',p.id).order('sort_order');if(mediaError)showError(root,'Media could not load.');else if(!media?.length)showError(root,'Demonstration media will be added here.');else media.forEach(m=>{if(m.media_type==='image'){const b=el('button','',{type:'button'});b.append(el('img','',{src:m.media_url,alt:m.alt_text||m.caption||'Project screenshot',loading:'lazy'}),el('strong',m.caption||'Project image'));b.addEventListener('click',()=>{document.querySelector('#viewer-body').replaceChildren(el('img','',{src:m.media_url,alt:m.alt_text||m.caption||'Project screenshot'}),el('p',m.caption||''));document.querySelector('#viewer').showModal()});root.append(b)}else if(m.media_type==='video'){const wrap=el('div','',{class:'card'}),v=el('video','',{src:m.media_url,controls:'',preload:'metadata',style:'width:100%'});wrap.append(v,el('p',m.caption||''));root.append(wrap)}else if(m.media_type==='external_video'){try{const u=new URL(m.media_url);if(u.hostname==='www.youtube.com'&&u.pathname.startsWith('/embed/')){const iframe=el('iframe','',{src:u.href,title:m.caption||'Project video',loading:'lazy',allowfullscreen:'',style:'width:100%;aspect-ratio:16/9;border:0'});root.append(iframe)}}catch{}}})}}document.querySelector('#close').addEventListener('click',()=>document.querySelector('#viewer').close())</script></body></html>
