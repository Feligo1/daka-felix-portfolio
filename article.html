</head><body><a href="#main" style="position:absolute;left:-9999px" onfocus="this.style.left='12px'" onblur="this.style.left='-9999px'">Skip to content</a><header class="top"><div class="wrap"><a class="brand" href="index.html">FELIX DAKA<span>.</span></a><button type="button" class="mobile-nav-toggle" aria-controls="portfolioNav" aria-expanded="false">Menu <span aria-hidden="true">☰</span></button><nav class="nav" id="portfolioNav" aria-label="Main"><a href="index.html">Home</a><a href="about.html">About</a><a href="projects.html" >Projects</a><a href="expertise.html">Skills</a><a href="certificates.html">Certificates</a><a href="journal.html" aria-current="page">Journal</a><a href="contact.html">Contact</a></nav></div></header><main id="main" class="wrap"><section class="hero"><a href="journal.html">← Technical journal</a><p class="eyebrow">Technical article</p><h1 id="title">Loading article…</h1><p id="summary" class="lead"></p><p class="meta" id="date"></p></section><section class="section prose"><img hidden id="cover" class="feature-image" alt=""><div id="body"></div></section></main><footer class="footer"><div class="wrap">© 2026 Felix Daka · <a href="mailto:felixddaka@gmail.com">Email</a> · <a href="https://github.com/Feligo1">GitHub</a> · <a href="https://www.linkedin.com/in/felix-daka-5b6058212">LinkedIn</a></div></footer><script type="module">import{supabase}from './supabase-client.js';import{el}from './portfolio-v2.js';const slug=new URLSearchParams(location.search).get('slug');if(slug){const {data:p,error}=await supabase.from('portfolio_journal').select('*').eq('slug',slug).eq('is_published',true).maybeSingle();if(error||!p){document.querySelector('#title').textContent='Article unavailable'}else{document.title=p.title+' | Felix Daka';document.querySelector('#title').textContent=p.title;document.querySelector('#summary').textContent=p.summary||'';document.querySelector('#date').textContent=p.published_at?new Date(p.published_at).toLocaleDateString('en-ZM',{day:'numeric',month:'long',year:'numeric'}):'';if(p.cover_url){const img=document.querySelector('#cover');img.src=p.cover_url;img.alt=p.title;img.hidden=false}const body=document.querySelector('#body');(p.body||'').split(/\n\n+/).forEach(paragraph=>body.append(el('p',paragraph)))}}else document.querySelector('#title').textContent='Article not specified'</script></body></html>
