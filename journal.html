<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Technical journal — Felix Daka, Computer Science graduate in Zambia"><title>Technical journal | Felix Daka</title><link rel="stylesheet" href="portfolio-v2.css"><script defer src="portfolio-page-nav.js"></script></head><body><a href="#main" style="position:absolute;left:-9999px" onfocus="this.style.left='12px'" onblur="this.style.left='-9999px'">Skip to content</a><header class="top"><div class="wrap"><a class="brand" href="index.html">FELIX DAKA<span>.</span></a><button type="button" class="mobile-nav-toggle" aria-controls="portfolioNav" aria-expanded="false">Menu <span aria-hidden="true">☰</span></button><nav class="nav" id="portfolioNav" aria-label="Main"><a href="index.html">Home</a><a href="about.html">About</a><a href="projects.html" >Projects</a><a href="expertise.html">Skills</a><a href="certificates.html">Certificates</a><a href="journal.html" aria-current="page">Journal</a><a href="contact.html">Contact</a></nav></div></header><main id="main" class="wrap"><section class="hero"><span class="eyebrow">Learning in public</span><h1>Technical journal</h1><p class="lead">Practical notes, lessons and articles on IT support, networking, programming, cloud computing and cybersecurity.</p></section><section class="section"><div class="controls"><input id="search" aria-label="Search articles" placeholder="Search articles" type="search"></div><div id="posts" class="grid" aria-live="polite">Loading articles…</div></section></main><footer class="footer"><div class="wrap">© 2026 Felix Daka · <a href="mailto:felixddaka@gmail.com">Email</a> · <a href="https://github.com/Feligo1">GitHub</a> · <a href="https://www.linkedin.com/in/felix-daka-5b6058212">LinkedIn</a></div></footer><script type="module">import{loadPublished,appendTextCard,showError}from './portfolio-v2.js';const root=document.querySelector('#posts'),search=document.querySelector('#search');let posts=[];try{posts=await loadPublished('portfolio_journal','published_at');render()}catch(e){console.error(e);showError(root,'Articles could not load.')}function render(){root.replaceChildren();const matches=posts.filter(p=>(p.title+' '+(p.summary||'')).toLowerCase().includes(search.value.toLowerCase()));if(!matches.length)showError(root,'No published articles yet.');else matches.forEach(p=>appendTextCard(root,p,'article.html?slug='+encodeURIComponent(p.slug)))}search.addEventListener('input',render)</script></body></html>
