name: Check portfolio references
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check required files and relative links
        run: node scripts/verify-site.mjs
      - name: Check cross-page navigation and responsive layout
        run: node scripts/check-layout-consistency.mjs
      - name: Check certificate previews and admin form controls
        run: node scripts/check-certificate-admin.mjs
      - name: Verify editorial layout and certificate viewer
        run: node scripts/check-editorial-v5.mjs
      - name: Verify original color palette and editorial media features
        run: node scripts/check-newsroom-v6.mjs
      - name: Check photos display fully at natural proportions
        run: node scripts/check-natural-media-v7.mjs
      - name: Verify About social feed and full photo presentation
        run: node scripts/check-about-feed-v8.mjs
      - name: Check project editor draft and media workflow
        run: node scripts/check-project-editor-v10.mjs
      - name: Validate capstone case study layout
        run: node scripts/check-capstone-case-study.mjs
