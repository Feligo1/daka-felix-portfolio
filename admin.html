<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Daka Felix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0A1931, #1A2C47);
            color: #F9FAFB;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .header h1 { font-size: 24px; display: flex; align-items: center; gap: 12px; }
        .header h1 i { color: #FCD116; }
        
        .stats { display: flex; gap: 20px; }
        .stat {
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 12px;
            text-align: center;
        }
        .stat .number { font-size: 24px; font-weight: bold; color: #FCD116; }
        .stat .label { font-size: 12px; color: #9CA3AF; }
        
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            padding: 12px 24px;
            background: rgba(255,255,255,0.05);
            border: none;
            color: #9CA3AF;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .tab-btn.active { background: #007749; color: white; }
        
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .card h2 { margin-bottom: 20px; font-size: 20px; display: flex; align-items: center; gap: 8px; }
        
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }
        
        .image-card {
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        
        .image-preview {
            width: 150px;
            height: 150px;
            margin: 0 auto 16px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007749;
        }
        
        .image-preview.square { border-radius: 16px; }
        
        .upload-area {
            border: 2px dashed #007749;
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-area:hover { background: rgba(0,119,73,0.1); border-color: #FCD116; }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .form-group { margin-bottom: 16px; }
        .form-group.full-width { grid-column: 1 / -1; }
        
        label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 13px; color: #FCD116; }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #007749;
        }
        
        button {
            padding: 12px 24px;
            background: #007749;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        button:hover { background: #005a3f; transform: translateY(-2px); }
        button.secondary { background: rgba(255,255,255,0.1); }
        button.danger { background: #EF4444; }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .cert-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .cert-item {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .cert-item:hover { border-color: #007749; transform: translateX(5px); }
        
        .cert-img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }
        
        .cert-info { flex: 1; }
        .cert-info h4 { margin-bottom: 4px; color: #FCD116; }
        .cert-info p { color: #9CA3AF; font-size: 12px; margin-top: 4px; }
        
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.success { background: rgba(16,185,129,0.2); border: 1px solid #10B981; color: #10B981; display: block; }
        .message.error { background: rgba(239,68,68,0.2); border: 1px solid #EF4444; color: #EF4444; display: block; }
        
        .loading { text-align: center; padding: 40px; color: #9CA3AF; }
        .loading i { animation: spin 1s linear infinite; display: inline-block; font-size: 32px; margin-bottom: 12px; }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .header { flex-direction: column; text-align: center; }
            .cert-item { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-cogs"></i> Portfolio Admin Panel</h1>
            <div class="stats">
                <div class="stat"><div class="number" id="certCount">0</div><div class="label">Certificates</div></div>
                <div class="stat"><div class="number" id="imgCount">2</div><div class="label">Images</div></div>
            </div>
        </div>
        
        <div id="messageBox" class="message"></div>
        
        <div class="tabs">
            <button class="tab-btn active" data-tab="images"><i class="fas fa-images"></i> Images</button>
            <button class="tab-btn" data-tab="certificates"><i class="fas fa-certificate"></i> Certificates</button>
            <button class="tab-btn" data-tab="add"><i class="fas fa-plus"></i> Add Certificate</button>
        </div>
        
        <!-- Images Tab -->
        <div class="tab-content active" id="imagesTab">
            <div class="card">
                <h2><i class="fas fa-user"></i> Profile Images</h2>
                <div class="image-grid">
                    <div class="image-card">
                        <h3>Profile Photo</h3>
                        <img src="" id="profilePreview" class="image-preview" alt="Profile">
                        <div class="upload-area" id="profileUploadArea">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Click to select image (JPG, PNG)</p>
                            <input type="file" id="profileInput" accept="image/jpeg,image/png,image/gif" hidden>
                            <div id="profileFileName" style="font-size:12px;margin-top:8px;"></div>
                        </div>
                        <button id="uploadProfileBtn"><i class="fas fa-upload"></i> Upload Profile</button>
                        <button id="resetProfileBtn" class="secondary" style="margin-left:8px;"><i class="fas fa-undo"></i> Reset</button>
                    </div>
                    
                    <div class="image-card">
                        <h3>About Section Image</h3>
                        <img src="" id="aboutPreview" class="image-preview square" alt="About">
                        <div class="upload-area" id="aboutUploadArea">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Click to select image (JPG, PNG)</p>
                            <input type="file" id="aboutInput" accept="image/jpeg,image/png,image/gif" hidden>
                            <div id="aboutFileName" style="font-size:12px;margin-top:8px;"></div>
                        </div>
                        <button id="uploadAboutBtn"><i class="fas fa-upload"></i> Upload About</button>
                        <button id="resetAboutBtn" class="secondary" style="margin-left:8px;"><i class="fas fa-undo"></i> Reset</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Certificates List Tab -->
        <div class="tab-content" id="certificatesTab">
            <div class="card">
                <h2><i class="fas fa-list"></i> Manage Certificates</h2>
                <div id="certificatesList" class="cert-list">
                    <div class="loading"><i class="fas fa-spinner"></i><br>Loading certificates...</div>
                </div>
            </div>
        </div>
        
        <!-- Add Certificate Tab -->
        <div class="tab-content" id="addTab">
            <div class="card">
                <h2><i class="fas fa-plus"></i> Add New Certificate</h2>
                <form id="certForm">
                    <div class="form-grid">
                        <div class="form-group"><label>Certificate Name *</label><input type="text" id="certName" required placeholder="e.g., Introduction to AI"></div>
                        <div class="form-group"><label>Issuer *</label><input type="text" id="certIssuer" required placeholder="e.g., Cisco"></div>
                        <div class="form-group"><label>Date Earned *</label><input type="date" id="certDate" required></div>
                        <div class="form-group"><label>Type</label><select id="certType"><option value="certificate">Certificate</option><option value="badge">Badge</option></select></div>
                        <div class="form-group full-width"><label>Description</label><textarea id="certDescription" rows="3" placeholder="Brief description..."></textarea></div>
                        <div class="form-group full-width">
                            <label>Certificate Image</label>
                            <div class="upload-area" id="certUploadArea">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <p>Click to upload image (JPG, PNG)</p>
                                <input type="file" id="certImageInput" accept="image/jpeg,image/png,image/gif" hidden>
                                <div id="certFileName" style="font-size:12px;margin-top:8px;"></div>
                            </div>
                        </div>
                    </div>
                    <button type="submit" id="submitCertBtn"><i class="fas fa-save"></i> Add Certificate</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { 
            getCertificates, 
            addCertificate, 
            deleteCertificate,
            getSiteSettings,
            updateSiteSetting
        } from './supabase-client.js'
        
        const DEFAULT_PROFILE = "https://scontent.fhre1-1.fna.fbcdn.net/v/t39.30808-6/556475553_1462651461635360_91226401548888980_n.jpg";
        const DEFAULT_ABOUT = "https://images.unsplash.com/photo-1529338296731-c4280a44fc48?ixlib=rb-4.0.3&auto=format&fit=crop&w=774&q=80";
        
        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${text}`;
            box.className = `message ${type}`;
            setTimeout(() => box.style.display = 'none', 4000);
        }
        
        async function uploadToImgur(file) {
            const formData = new FormData();
            formData.append('image', file);
            try {
                const res = await fetch('https://api.imgur.com/3/image', {
                    method: 'POST',
                    headers: { 'Authorization': 'Client-ID 5e3e6a7e8f8d7c0' },
                    body: formData
                });
                const data = await res.json();
                return data.success ? data.data.link : null;
            } catch (error) {
                console.error('Imgur error:', error);
                return null;
            }
        }
        
        async function loadImages() {
            const settings = await getSiteSettings();
            document.getElementById('profilePreview').src = settings.profile_image_url || DEFAULT_PROFILE;
            document.getElementById('aboutPreview').src = settings.about_image_url || DEFAULT_ABOUT;
        }
        
        async function loadCertificates() {
            const container = document.getElementById('certificatesList');
            try {
                const certs = await getCertificates();
                document.getElementById('certCount').textContent = certs.length;
                
                if (certs.length === 0) {
                    container.innerHTML = '<div class="loading"><i class="fas fa-certificate"></i><br>No certificates yet</div>';
                    return;
                }
                
                container.innerHTML = '';
                for (const cert of certs) {
                    const div = document.createElement('div');
                    div.className = 'cert-item';
                    div.innerHTML = `
                        <img src="${cert.image_url || ''}" class="cert-img" onerror="this.src='https://via.placeholder.com/60'">
                        <div class="cert-info">
                            <h4>${escapeHtml(cert.name)}</h4>
                            <p>${escapeHtml(cert.issuer || 'Unknown')} • ${cert.date_earned || ''}</p>
                            ${cert.description ? `<p>${escapeHtml(cert.description)}</p>` : ''}
                        </div>
                        <button class="delete-cert" data-id="${cert.id}"><i class="fas fa-trash"></i> Delete</button>
                    `;
                    container.appendChild(div);
                }
                
                document.querySelectorAll('.delete-cert').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        if (confirm('Delete this certificate?')) {
                            const result = await deleteCertificate(btn.dataset.id);
                            if (result.success) {
                                await loadCertificates();
                                showMessage('Certificate deleted', 'success');
                            } else {
                                showMessage('Delete failed', 'error');
                            }
                        }
                    });
                });
            } catch (error) {
                container.innerHTML = '<div class="loading"><i class="fas fa-exclamation-triangle"></i><br>Error loading</div>';
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tabId = btn.dataset.tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(tabId + 'Tab').classList.add('active');
                if (tabId === 'images') loadImages();
                if (tabId === 'certificates') loadCertificates();
            });
        });
        
        // Upload profile
        document.getElementById('uploadProfileBtn').addEventListener('click', async () => {
            const file = document.getElementById('profileInput').files[0];
            if (!file) { showMessage('Select an image', 'error'); return; }
            const btn = document.getElementById('uploadProfileBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
            btn.disabled = true;
            const url = await uploadToImgur(file);
            if (url) {
                await updateSiteSetting('profile_image_url', url, 'image');
                await loadImages();
                showMessage('Profile updated!', 'success');
            } else {
                showMessage('Upload failed', 'error');
            }
            btn.innerHTML = '<i class="fas fa-upload"></i> Upload Profile';
            btn.disabled = false;
            document.getElementById('profileInput').value = '';
            document.getElementById('profileFileName').textContent = '';
        });
        
        // Upload about
        document.getElementById('uploadAboutBtn').addEventListener('click', async () => {
            const file = document.getElementById('aboutInput').files[0];
            if (!file) { showMessage('Select an image', 'error'); return; }
            const btn = document.getElementById('uploadAboutBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
            btn.disabled = true;
            const url = await uploadToImgur(file);
            if (url) {
                await updateSiteSetting('about_image_url', url, 'image');
                await loadImages();
                showMessage('About image updated!', 'success');
            } else {
                showMessage('Upload failed', 'error');
            }
            btn.innerHTML = '<i class="fas fa-upload"></i> Upload About';
            btn.disabled = false;
            document.getElementById('aboutInput').value = '';
            document.getElementById('aboutFileName').textContent = '';
        });
        
        // Reset images
        document.getElementById('resetProfileBtn').addEventListener('click', async () => {
            await updateSiteSetting('profile_image_url', DEFAULT_PROFILE, 'image');
            await loadImages();
            showMessage('Profile reset', 'success');
        });
        
        document.getElementById('resetAboutBtn').addEventListener('click', async () => {
            await updateSiteSetting('about_image_url', DEFAULT_ABOUT, 'image');
            await loadImages();
            showMessage('About image reset', 'success');
        });
        
        // Add certificate
        document.getElementById('certForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = document.getElementById('certImageInput').files[0];
            let imageUrl = null;
            if (file) {
                const btn = document.getElementById('submitCertBtn');
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
                btn.disabled = true;
                imageUrl = await uploadToImgur(file);
                btn.innerHTML = '<i class="fas fa-save"></i> Add Certificate';
                btn.disabled = false;
            }
            const result = await addCertificate({
                name: document.getElementById('certName').value,
                issuer: document.getElementById('certIssuer').value,
                description: document.getElementById('certDescription').value,
                date_earned: document.getElementById('certDate').value,
                certificate_type: document.getElementById('certType').value,
                image_url: imageUrl,
                is_active: true
            });
            if (result.success) {
                showMessage('Certificate added!', 'success');
                document.getElementById('certForm').reset();
                document.getElementById('certImageInput').value = '';
                document.getElementById('certFileName').textContent = '';
                document.getElementById('certDate').value = new Date().toISOString().split('T')[0];
                await loadCertificates();
                document.querySelector('[data-tab="certificates"]').click();
            } else {
                showMessage('Failed to add', 'error');
            }
        });
        
        // File upload areas
        document.getElementById('profileUploadArea').addEventListener('click', () => document.getElementById('profileInput').click());
        document.getElementById('aboutUploadArea').addEventListener('click', () => document.getElementById('aboutInput').click());
        document.getElementById('certUploadArea').addEventListener('click', () => document.getElementById('certImageInput').click());
        
        document.getElementById('profileInput').addEventListener('change', (e) => {
            if (e.target.files[0]) document.getElementById('profileFileName').textContent = e.target.files[0].name;
        });
        document.getElementById('aboutInput').addEventListener('change', (e) => {
            if (e.target.files[0]) document.getElementById('aboutFileName').textContent = e.target.files[0].name;
        });
        document.getElementById('certImageInput').addEventListener('change', (e) => {
            if (e.target.files[0]) document.getElementById('certFileName').textContent = e.target.files[0].name;
        });
        
        document.getElementById('certDate').value = new Date().toISOString().split('T')[0];
        
        // Initialize
        loadImages();
        loadCertificates();
    </script>
</body>
</html>
